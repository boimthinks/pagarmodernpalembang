<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a111e"/>
      <stop offset="50%" stop-color="#070d17"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric Grid Background Pattern (Laser Cut Effect) -->
  <g stroke="#1e293b" stroke-width="1.5" opacity="0.35">
    <path d="M50 50h1100v530H50z"/>
    <path d="M50 150h1100M50 250h1100M50 350h1100M50 450h1100"/>
    <path d="M150 50v530M250 50v530M350 50v530M450 50v530M550 50v530M650 50v530M750 50v530M850 50v530M950 50v530M1050 50v530"/>
  </g>

  <!-- Content Container -->
  <g transform="translate(100, 140)">
    <!-- Brand Badge -->
    <rect width="360" height="42" rx="21" fill="#047857" opacity="0.3"/>
    <rect width="360" height="42" rx="21" fill="none" stroke="#10b981" stroke-width="1.5"/>
    <text x="24" y="27" font-family="sans-serif" font-size="16" font-weight="700" fill="#34d399" letter-spacing="1.5">
      ★ SRIWIJAYA GRAFIKA PALEMBANG
    </text>

    <!-- Main Title -->
    <text x="0" y="125" font-family="sans-serif" font-size="58" font-weight="800" fill="#ffffff" letter-spacing="-1">
      PAGAR MODERN PALEMBANG
    </text>
    <text x="0" y="195" font-family="sans-serif" font-size="44" font-weight="700" fill="url(#accent)">
      Spesialis Plat Cutting Laser Presisi
    </text>

    <!-- Subtitle -->
    <text x="0" y="260" font-family="sans-serif" font-size="24" fill="#94a3b8">
      Pagar • Pintu Gerbang • Balkon • Railing Tangga • Plat Besi 0.6–12mm
    </text>

    <!-- Contact & Location Box -->
    <g transform="translate(0, 320)">
      <rect width="720" height="60" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <text x="24" y="36" font-family="sans-serif" font-size="20" font-weight="700" fill="#10b981">
        WhatsApp: 0852-1511-1125
      </text>
      <text x="360" y="36" font-family="sans-serif" font-size="18" fill="#cbd5e1">
        Workshop: Talang Jambe, Sukarami
      </text>
    </g>
  </g>
</svg>
